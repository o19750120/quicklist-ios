name: Transcribe episode

# 轉錄不需要 macOS，用 Ubuntu 快得多。ffmpeg 要自己裝，runner 沒有預裝。
on:
  workflow_dispatch:
    inputs:
      show:
        description: "節目名稱（Spotify 上顯示的）"
        required: false
      episode:
        description: "集數標題"
        required: false
      spotify_id:
        description: "Spotify episode id（可留空）"
        required: false
      language:
        description: "音檔語言代碼，例如 ja / en / ko"
        required: false
        default: "ja"
      dry_run:
        description: "只測試找不找得到音檔，不實際轉錄"
        type: boolean
        default: false
  # App 排隊後，Supabase 觸發器會立刻打這個進來，不必等排程
  repository_dispatch:
    types: [transcribe]
  schedule:
    # 兜底：萬一觸發器沒送到，排程會把漏掉的撿起來
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: |
          # 形態素解析器，用來找出日文真正的詞邊界，
          # 斷句才不會切出「日」「本語」這種東西。
          # 沒裝的話 segment.py 會安靜略過那一步 —— 也就是說
          # 忘了裝不會報錯，只會讓優化在雲端默默失效（ffmpeg 就踩過這個坑）。
          python -m pip install --quiet sudachipy sudachidict_core
          python -c "from sudachipy import Dictionary; Dictionary(dict='core').create(); print('sudachipy 就緒')"
          # 建離線字典要用（zstd 解壓、簡繁轉換）
          python -m pip install --quiet zstandard opencc

      # 排程每 15 分鐘跑一次，但多數時候沒有工作。字典有 293 MB，
      # 每次都還原快取等於一天搬 28 GB —— 所以先確認真的有事要做。
      - name: 有沒有工作要做
        id: work
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"       # 手動或資料庫叫醒，一定有事
          elif python backend/status.py --has-queued; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "沒有排隊中的任務，跳過字典與 ffmpeg 的準備"
          fi

      # 字典 293 MB，重建一次要下載 115 MB 再花幾分鐘。
      # 內容只跟 dictionary.py 裡釘死的來源版本有關，所以拿那個檔案的
      # hash 當快取鍵 —— 換版本才會重建，平常直接取快取。
      - name: 取用字典快取
        id: dict-cache
        if: steps.work.outputs.yes == 'true'
        uses: actions/cache@v4
        with:
          path: backend/data
          key: jadict-${{ hashFiles('backend/dictionary.py') }}

      - name: 建離線字典
        if: steps.work.outputs.yes == 'true' && steps.dict-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python backend/dictionary.py --build

      - name: 確認字典可用
        if: steps.work.outputs.yes == 'true'
        run: |
          set -euo pipefail
          # 不要接管線，失敗的退出碼會被吃掉（ffmpeg 就踩過這個坑）。
          # 沒有字典的話 vocab.build() 會安靜回空的 —— 又是一個靜默失效。
          python backend/dictionary.py --lookup 市場 --reading シジョウ

      - name: 安裝 ffmpeg
        if: steps.work.outputs.yes == 'true'
        run: |
          # runner 沒有預裝。缺了它有兩個後果，而且都是靜默的：
          # 涵蓋檢查量不到音檔長度會自己跳過，Whisper 備援也壓縮不了音檔。
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 環境資訊
        run: |
          set -euo pipefail
          python --version
          echo "觸發方式：${{ github.event_name }}"
          echo "有工作要做：${{ steps.work.outputs.yes }}"

      # ffmpeg 是條件安裝的，所以驗證也要同一個條件 ——
      # 不然沒工作的那些排程會因為 ffmpeg 不在而整個失敗。
      - name: 確認 ffmpeg 可用
        if: steps.work.outputs.yes == 'true'
        run: |
          set -euo pipefail
          # 不要接管線，不然指令失敗會被 head 的退出碼蓋掉，
          # 這正是先前 ffmpeg 沒裝卻沒人發現的原因
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 手動指定的單集
        if: github.event_name == 'workflow_dispatch' && inputs.show != ''
        run: |
          ARGS=(--show "${{ inputs.show }}" --episode "${{ inputs.episode }}" --language "${{ inputs.language }}")
          if [ -n "${{ inputs.spotify_id }}" ]; then
            ARGS+=(--spotify-id "${{ inputs.spotify_id }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python backend/transcribe.py "${ARGS[@]}"

      - name: 資料庫叫醒的單集
        if: github.event_name == 'repository_dispatch'
        run: |
          python backend/transcribe.py --job "${{ github.event.client_payload.job_id }}"

      - name: 撿排隊中的任務
        if: github.event_name == 'schedule'
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "沒有設定 Supabase，跳過"
            exit 0
          fi
          python backend/run_queued.py

      - name: 通知 Discord
        if: always() && github.event_name != 'schedule'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "沒有 webhook，跳過通知"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            TITLE="✅ 逐字稿完成"
            COLOR=3066993
          else
            TITLE="❌ 逐字稿失敗"
            COLOR=15158332
          fi
          # 節目資訊由 transcribe.py 寫進 GITHUB_ENV，
          # 所以不論手動觸發還是資料庫叫醒，通知都有內容。
          # 用 embed 的 fields 排版，就不必在 shell 裡拼多行字串。
          jq -n --arg t "$TITLE" --argjson c "$COLOR" --arg show "${KIKITORI_SHOW:-（未記錄）}" --arg ep "${KIKITORI_EPISODE:-（未記錄）}" --arg result "${KIKITORI_RESULT:-}" --arg url "$RUN_URL" '{username:"Kikitori", embeds:[{title:$t, color:$c, fields:([{name:"節目",value:$show},{name:"集數",value:$ep}] + (if $result == "" then [] else [{name:"結果",value:$result}] end) + [{name:"記錄",value:$url}])}]}' > discord.json
          curl -sS -X POST -H "Content-Type: application/json" -H "User-Agent: Mozilla/5.0 (compatible; KikitoriCI/1.0)" --data @discord.json "$WEBHOOK" && echo "已通知" || echo "通知失敗（不影響結果）"
