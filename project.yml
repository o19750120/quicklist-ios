name: Kikitori
options:
  bundleIdPrefix: com.o19750120
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Kikitori:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.o19750120.kikitori
        PRODUCT_NAME: Kikitori
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - KikitoriUITests

  # 只在 Mac 上跑，CI 的 build action 不會碰到它。
  # 用途是讓開發時能自動走過各個畫面並留下截圖，不必手動點。
  KikitoriUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: Kikitori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.o19750120.kikitori.uitests
        TEST_TARGET_NAME: Kikitori
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
